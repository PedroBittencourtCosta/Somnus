{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="mb-4">
        <div class="d-flex align-items-center">
            <a href="{% url 'gerenciar_questionarios' %}"
                class="text-secondary text-decoration-none me-4 hover-primary">
                <svg width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" viewBox="0 0 24 24" class="transition">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 8 8 12 12 16"></polyline>
                    <line x1="16" y1="12" x2="8" y2="12"></line>
                </svg>
            </a>
            <h2 class="fw-bold mb-0" style="color: var(--somnus-blue-deep);">Motor de Cálculo: {{ questionario.titulo }}
            </h2>
        </div>
        <p class="text-muted mt-2" style="margin-left: 4.2rem;">Defina como o sistema deve processar os resultados dessa
            avaliação.</p>
    </div>

    <!-- Container para as mensagens de sucesso/erro estilo Bootstrap -->
    <div id="alertContainer"></div>

    <div id="viewList" class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body p-4 text-center">
            <h4 class="fw-bold text-primary mb-4">Escalas Já Cadastradas</h4>
            <div class="row g-3 justify-content-center mb-4" id="templateCardsContainer">
                <!-- Preenchido via JS -->
            </div>

            <hr class="w-50 mx-auto my-4">

            <h5 class="fw-bold mb-3">Ou crie uma nova escala do zero</h5>
            <button id="btnNovaEscala" class="btn btn-success btn-lg rounded-pill px-5 fw-bold shadow-sm">
                <i class="bi bi-plus-circle me-2"></i>Cadastrar Nova Escala
            </button>
        </div>
    </div>

    {% include 'partials/_escala_builder.html' %}
</div>

<script id="configData" type="application/json">
    {{ config_json|safe }}
</script>
<script id="perguntasData" type="application/json">
    {{ perguntas_json|safe }}
</script>
<script id="escalasTemplatesData" type="application/json">
    {{ escalas_templates_json|safe }}
</script>
<script>
    const configAtual = JSON.parse(document.getElementById('configData').textContent);
    const perguntas = JSON.parse(document.getElementById('perguntasData').textContent);
    const escalasTemplates = JSON.parse(document.getElementById('escalasTemplatesData').textContent);

    const select = document.getElementById('strategySelect');
    const builder = document.getElementById('dynamicBuilder');
    const editor = document.getElementById('jsonEditor');
    const btnSalvar = document.getElementById('btnSalvar');
    const jsonError = document.getElementById('jsonError');

    const viewList = document.getElementById('viewList');
    const viewBuilder = document.getElementById('viewBuilder');

    let currentEscalaId = null;

    function showBuilder() {
        viewList.style.display = 'none';
        viewBuilder.style.display = 'block';
    }

    function showList() {
        viewBuilder.style.display = 'none';
        viewList.style.display = 'block';
        currentEscalaId = null;
    }

    document.getElementById('btnNovaEscala').addEventListener('click', () => {
        currentEscalaId = null;
        document.getElementById('nomeEscala').value = 'Nova Escala';
        loadJsonIntoBuilder({ operacao: 'SUM', variaveis: [], limiares: [] });
        showBuilder();
    });

    document.getElementById('btnVoltarLista').addEventListener('click', showList);

    // Carrega templates na lista
    const container = document.getElementById('templateCardsContainer');

    function renderizarLista() {
        container.innerHTML = '';
        if (escalasTemplates.length === 0) {
            container.innerHTML = `<p class="text-muted">Nenhuma escala cadastrada no sistema ainda.</p>`;
        } else {
            escalasTemplates.forEach(t => {
                const isLinked = t.is_linked;
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4 text-start mb-3';

                col.innerHTML = `
                    <div class="card h-100 shadow-sm border-light-subtle ${isLinked ? 'border-success border-2 bg-success bg-opacity-10' : ''}">
                        <div class="card-body d-flex flex-column">
                            <h6 class="fw-bold text-dark mb-1">${t.nome}</h6>
                            <small class="text-muted d-block mb-3">Motor: ${t.strategy_class}</small>
                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-sm flex-grow-1 fw-semibold ${isLinked ? 'btn-outline-danger' : 'btn-success'}" onclick="toggleVincular(${t.id}, ${isLinked})">
                                    ${isLinked ? '<i class="bi bi-x-circle me-1"></i> Desvincular' : '<i class="bi bi-link me-1"></i> Vincular'}
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="editarEscala(${t.id})" title="Editar Regras">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }
    }

    renderizarLista();

    window.toggleVincular = function (id, currentlyLinked) {
        const acao = currentlyLinked ? 'desvincular' : 'vincular';
        fetch(window.location.href, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ acao: acao, escala_id: id })
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const t = escalasTemplates.find(t => t.id === id);
                    if (t) t.is_linked = !currentlyLinked;
                    renderizarLista();
                    showAlert(`Escala ${acao === 'vincular' ? 'vinculada' : 'desvinculada'} com sucesso!`, 'success');
                } else {
                    showAlert('Erro: ' + data.message, 'danger');
                }
            });
    }

    window.editarEscala = function (id) {
        const template = escalasTemplates.find(t => t.id === id);
        if (template) {
            currentEscalaId = template.id;
            document.getElementById('nomeEscala').value = template.nome;
            select.value = template.strategy_class;
            select.dispatchEvent(new Event('change'));
            if (template.strategy_class === 'DYNAMIC') {
                loadJsonIntoBuilder(template.config);
            }
            showBuilder();
        }
    };

    function loadJsonIntoBuilder(config) {
        // Reset visual builder
        simplesTagInput.clear();
        document.getElementById('simplesLimiaresContainer').innerHTML = '';
        document.getElementById('subescalasContainer').innerHTML = '';

        if (!config || !config.operacao) {
            document.getElementById('opType').value = 'SUM';
            document.getElementById('opType').dispatchEvent(new Event('change'));
            editor.value = "{\n  \"operacao\": \"SUM\",\n  \"variaveis\": [],\n  \"limiares\": []\n}";
            return;
        }

        document.getElementById('opType').value = config.operacao;
        document.getElementById('opType').dispatchEvent(new Event('change'));

        if (config.operacao === 'SUM' || config.operacao === 'AVERAGE') {
            if (config.variaveis) {
                simplesTagInput.setTags(config.variaveis);
            }
            if (config.limiares) {
                config.limiares.forEach(lim => {
                    document.getElementById('btnAddLimiarSimples').click();
                    const items = document.querySelectorAll('#simplesLimiaresContainer .limiar-item');
                    if (items.length > 0) {
                        const lastItem = items[items.length - 1];
                        const inputs = lastItem.querySelectorAll('input');
                        inputs[0].value = lim.max;
                        inputs[1].value = lim.status;
                    }
                });
            }
        } else if (config.operacao === 'SUM_BY_SUBSCALE') {
            if (config.subescalas) {
                for (const [nome, vars] of Object.entries(config.subescalas)) {
                    const card = window.buildSubescalaCard();
                    document.getElementById('subescalasContainer').appendChild(card);
                    card.querySelector('.sub-nome').value = nome;
                    window.setSubVarTags(card, vars);

                    if (config.limiares && config.limiares[nome]) {
                        const btnLimiar = card.querySelector('button[onclick="window.addSubLimiar(this)"]');
                        config.limiares[nome].forEach(lim => {
                            window.addSubLimiar(btnLimiar);
                            const limItems = card.querySelectorAll('.sub-limiar-item');
                            if (limItems.length > 0) {
                                const lastLimItem = limItems[limItems.length - 1];
                                const inputs = lastLimItem.querySelectorAll('input');
                                inputs[0].value = lim.max;
                                inputs[1].value = lim.status;
                            }
                        });
                    }
                }
            }
        }

        // Atualiza JSON editor
        editor.value = JSON.stringify(config, null, 2);
    }

    // Inicializa
    select.value = 'DYNAMIC';
    showList();

    // Toggle builder
    select.addEventListener('change', (e) => {
        if (e.target.value === 'DYNAMIC') {
            builder.style.display = 'block';
        } else {
            builder.style.display = 'none';
        }
    });

    select.dispatchEvent(new Event('change'));

    // Assistente Visual Lógica
    const opType = document.getElementById('opType');
    const uiSimples = document.getElementById('uiSimples');
    const uiSubescala = document.getElementById('uiSubescala');

    opType.addEventListener('change', () => {
        if (opType.value === 'SUM_BY_SUBSCALE') {
            uiSimples.style.display = 'none';
            uiSubescala.style.display = 'block';
        } else {
            uiSimples.style.display = 'block';
            uiSubescala.style.display = 'none';
        }
    });

    // Limiares Simples
    const simplesLimiaresContainer = document.getElementById('simplesLimiaresContainer');
    document.getElementById('btnAddLimiarSimples').addEventListener('click', () => {
        const div = document.createElement('div');
        div.className = 'd-flex gap-2 mb-2 limiar-item';
        div.innerHTML = `
            <input type="number" step="0.1" class="form-control form-control-sm" placeholder="Valor Máx (ex: 10)">
            <input type="text" class="form-control form-control-sm" placeholder="Status (ex: Baixo)">
            <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">X</button>
        `;
        simplesLimiaresContainer.appendChild(div);
    });

    // Sub-escalas
    const subescalasContainer = document.getElementById('subescalasContainer');
    document.getElementById('btnAddSubescala').addEventListener('click', () => {
        const card = window.buildSubescalaCard();
        subescalasContainer.appendChild(card);
    });

    window.addSubLimiar = function (btn) {
        const container = btn.previousElementSibling;
        const div = document.createElement('div');
        div.className = 'd-flex gap-2 mt-2 sub-limiar-item';
        div.innerHTML = `
            <input type="number" step="0.1" class="form-control form-control-sm" placeholder="Máx">
            <input type="text" class="form-control form-control-sm" placeholder="Status">
            <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
    };

    document.getElementById('btnGerarJson').addEventListener('click', () => {
        const op = opType.value;
        let result = { operacao: op };

        if (op === 'SUM' || op === 'AVERAGE') {
            // Lê as tags do tag-input (+ qualquer texto ainda no input)
            const pendingText = document.getElementById('simplesVarsInput').value.trim();
            if (pendingText) simplesTagInput.setTags([...simplesTagInput.getTags(), ...pendingText.split(',').map(v => v.trim()).filter(v => v)]);
            result.variaveis = simplesTagInput.getTags();

            const limiares = [];
            document.querySelectorAll('#simplesLimiaresContainer .limiar-item').forEach(item => {
                const inputs = item.querySelectorAll('input');
                const maxVal = parseFloat(inputs[0].value);
                const statusVal = inputs[1].value.trim();
                if (!isNaN(maxVal) && statusVal) {
                    limiares.push({ max: maxVal, status: statusVal });
                }
            });
            if (limiares.length > 0) result.limiares = limiares;

        } else if (op === 'SUM_BY_SUBSCALE') {
            result.subescalas = {};
            result.limiares = {};

            document.querySelectorAll('#subescalasContainer .subescala-item').forEach(item => {
                const nome = item.querySelector('.sub-nome').value.trim();
                // Flush texto pendente antes de ler
                const pendingInput = item.querySelector('.sub-vars-input');
                if (pendingInput && pendingInput.value.trim()) {
                    pendingInput.dispatchEvent(new Event('blur'));
                }
                const vars = window.getSubVarTags(item);

                if (nome && vars.length > 0) {
                    result.subescalas[nome] = vars;

                    const limiares = [];
                    item.querySelectorAll('.sub-limiar-item').forEach(limItem => {
                        const inputs = limItem.querySelectorAll('input');
                        const maxVal = parseFloat(inputs[0].value);
                        const statusVal = inputs[1].value.trim();
                        if (!isNaN(maxVal) && statusVal) {
                            limiares.push({ max: maxVal, status: statusVal });
                        }
                    });

                    if (limiares.length > 0) {
                        result.limiares[nome] = limiares;
                    }
                }
            });

            if (Object.keys(result.limiares).length === 0) {
                delete result.limiares;
            }
        }

        editor.value = JSON.stringify(result, null, 2);
    });

    // Save
    btnSalvar.addEventListener('click', () => {
        let payload = {
            strategy_class: select.value,
            escala_id: currentEscalaId,
            nome: document.getElementById('nomeEscala').value
        };

        if (select.value === 'DYNAMIC') {
            try {
                payload.config_dinamica = JSON.parse(editor.value);
                jsonError.style.display = 'none';
            } catch (err) {
                jsonError.style.display = 'block';
                return;
            }
        }

        btnSalvar.disabled = true;
        btnSalvar.innerText = "Salvando...";

        fetch(window.location.href, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert('Regras de cálculo salvas com sucesso!', 'success');
                    currentEscalaId = data.escala_id;

                    // Update templates array and re-render
                    let existing = escalasTemplates.find(t => t.id === currentEscalaId);
                    if (existing) {
                        existing.nome = data.nome;
                        existing.config = payload.config_dinamica;
                    } else {
                        escalasTemplates.push({
                            id: currentEscalaId,
                            nome: data.nome,
                            questionario_id: parseInt('{{ questionario.id }}', 10),
                            questionario_titulo: '{{ questionario.titulo }}',
                            config: payload.config_dinamica
                        });
                    }
                    renderizarLista();
                } else {
                    showAlert('Erro ao salvar: ' + data.message, 'danger');
                }
            })
            .catch(err => {
                showAlert('Falha na requisição.', 'danger');
            })
            .finally(() => {
                btnSalvar.disabled = false;
                btnSalvar.innerText = "Salvar Configurações";
                window.scrollTo({ top: 0, behavior: 'smooth' }); // Sobe a página para o usuário ver o alerta
            });
    });

    // Helper CSRF
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Custom Alert
    function showAlert(message, type) {
        const container = document.getElementById('alertContainer');
        container.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
                <i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill'} me-2"></i>
                <div>${message}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        setTimeout(() => {
            const alertNode = container.querySelector('.alert');
            if (alertNode) {
                const bsAlert = new bootstrap.Alert(alertNode);
                bsAlert.close();
            }
        }, 5000);
    }
</script>
{% endblock %}
