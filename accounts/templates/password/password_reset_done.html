{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="mb-4">
                    <i class="bi bi-envelope-check" style="font-size: 3rem; color: var(--somnus-blue-inst);"></i>
                </div>
                <h2 class="fw-bold mb-3" style="color: var(--somnus-blue-deep);">E-mail Enviado!</h2>
                <p class="text-muted mb-4">
                    Enviamos as instruções para a recuperação da sua senha. Por favor, verifique sua caixa de entrada e
                    a pasta de spam.
                </p>
                <div class="d-grid">
                    <a href="{% url 'home' %}" class="btn btn-lg rounded-pill fw-bold text-white py-3"
                        style="background-color: var(--somnus-blue-deep);">
                        Voltar para o Início
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
