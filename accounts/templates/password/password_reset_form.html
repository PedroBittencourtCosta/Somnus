{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5 bg-white text-center">
                    <h2 class="fw-bold mb-3" style="color: var(--somnus-blue-deep);">Recuperar Senha</h2>
                    <p class="text-muted small mb-4">
                        Insira seu e-mail abaixo. Enviaremos um link seguro para você definir uma nova senha.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            {% bootstrap_field form.email show_label=False placeholder="Seu e-mail cadastrado" %}
                        </div>
                        <button type="submit" class="btn btn-lg w-100 rounded-pill fw-bold text-white shadow-sm py-3"
                            style="background-color: var(--somnus-blue-deep);">
                            Enviar Link de Recuperação
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
