{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5 text-center">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                <div class="mb-4">
                    <i class="bi bi-check-circle-fill" style="font-size: 3rem; color: #198754;"></i>
                </div>
                <h2 class="fw-bold mb-3" style="color: var(--somnus-blue-deep);">Senha Redefinida!</h2>
                <p class="text-muted mb-4">Sua senha foi alterada com sucesso. Agora você já pode entrar no sistema com
                    sua nova credencial.</p>
                <div class="d-grid">
                    <a href="{% url 'home' %}" class="btn btn-lg rounded-pill fw-bold text-white py-3"
                        style="background-color: var(--somnus-blue-deep);">
                        Ir para o Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
